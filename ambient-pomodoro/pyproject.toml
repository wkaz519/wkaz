[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ambient-pomodoro"
version = "0.1.0"
description = "A desktop Pomodoro timer with animated, long-looping ambient backgrounds."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.4",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ambient-pomodoro = "pomodoro.cli:main"

[tool.setuptools.packages.find]
include = ["pomodoro*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
